<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCqOMWOyUKq-i9GlwB2KqpCpJCNAOvHlIY",
        authDomain: "voca-69.firebaseapp.com",
        databaseURL: "https://voca-69-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "voca-69",
        storageBucket: "voca-69.firebasestorage.app",
        messagingSenderId: "960668024510",
        appId: "1:960668024510:web:ef4148c6b0cad40dcf68ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- 優化：本地狀態管理 ---
    let myId = "u_" + Math.random().toString(36).substr(2, 5);
    let myRoomId, isHost = false;
    let timerInterval, gameStartTime;
    let sessionHistory = [];
    let currentLocalData = null; // 存儲當前房間所有數據
    let lastRenderedQ = -1; // 防止重複繪製題目

    // --- 核心邏輯 ---
    window.createRoom = async () => {
        const name = document.getElementById('username').value || '玩家';
        myRoomId = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;
        await set(ref(db, 'rooms/' + myRoomId), { 
            state: 'lobby', 
            currentQIndex: -1, 
            settings: { timeLimit: 10, maxQs: 10, level: 'lv5' }, 
            players: { [myId]: { name, score: 0, answer: -1, tempAns: -1 } } 
        });
        initLobby();
    };

    window.joinRoom = async () => {
        const name = document.getElementById('username').value || '玩家';
        myRoomId = document.getElementById('room-code-input').value;
        const snap = await get(ref(db, 'rooms/' + myRoomId));
        if(snap.exists() && snap.val().state === 'lobby') {
            await update(ref(db, `rooms/${myRoomId}/players/${myId}`), { name, score: 0, answer: -1, tempAns: -1 });
            initLobby();
        } else alert("戰局不存在或已開始");
    };

    function initLobby() {
        document.getElementById('display-room-code').innerText = myRoomId;
        showScreen('screen-lobby');
        if(isHost) document.getElementById('host-controls').style.display = 'block', document.getElementById('btn-start').style.display = 'block';

        // 優化：單一監聽器處理所有邏輯
        onValue(ref(db, 'rooms/' + myRoomId), (snap) => {
            const data = snap.val();
            if(!data) return;
            currentLocalData = data; // 更新快取

            // 1. 只有在大廳時才頻繁渲染玩家清單
            if(data.state === 'lobby') {
                renderLobbyPlayers(data.players);
            }
            
            // 2. 遊戲進行中的邏輯
            if(data.state === 'playing') {
                smartRenderGame(data);
            }
            
            if(data.state === 'finished') {
                renderResult(data.players);
            }
        });
    }

    // 優化：智能渲染題目，只有題目變了才更新介面
    function smartRenderGame(data) {
        showScreen('screen-game');
        const qIndex = data.currentQIndex;
        const q = data.questions[qIndex];
        const me = data.players[myId];

        // 更新分數 (不影響題目 UI，可以頻繁更新)
        document.getElementById('my-score').innerText = `${me.score} PTS`;
        document.getElementById('q-counter').innerText = `Q${qIndex+1}/${data.questions.length}`;

        // 只有題目序號改變，或是從「答題中」轉為「顯示結果」時才重繪按鈕
        if(lastRenderedQ !== qIndex || document.body.dataset.showingResult != String(data.showResult)) {
            document.getElementById('question-text').innerText = q.q;
            document.body.dataset.showingResult = data.showResult;
            lastRenderedQ = qIndex;

            for(let i=0; i<4; i++) {
                const b = document.getElementById(`opt-${i}`);
                b.innerText = q.options[i];
                b.className = 'btn-option';
                b.disabled = data.showResult || me.tempAns !== -1;
                
                if(data.showResult) {
                    if(i === q.ans) b.classList.add('btn-correct');
                    else if(me.tempAns === i) b.classList.add('btn-wrong');
                }
            }

            // 如果是新題目，重啟計時器
            if(!data.showResult && me.tempAns === -1) {
                startTimer(data.settings.timeLimit);
            } else {
                clearInterval(timerInterval);
            }
        }

        // 處理戰報紀錄
        if(data.showResult && !data.logged) {
            logHistory(q, me);
            data.logged = true; // 僅本地標記
        }

        document.getElementById('status-msg').innerText = data.showResult ? "本題結束" : (me.tempAns !== -1 ? "等待對手..." : "");
    }

    function logHistory(q, me) {
        if(sessionHistory.some(h => h.q === q.q)) return;
        sessionHistory.push({
            q: q.q,
            correct: q.options[q.ans],
            mine: me.tempAns !== -1 ? q.options[me.tempAns] : "未作答",
            isCorrect: me.tempAns === q.ans
        });
    }

    // --- 優化：更平滑的計時器 ---
    function startTimer(sec) {
        clearInterval(timerInterval);
        gameStartTime = Date.now();
        const bar = document.getElementById('timer-bar');
        timerInterval = setInterval(() => {
            const elap = Date.now() - gameStartTime;
            const rem = Math.max(0, 100 - (elap / (sec * 1000) * 100));
            bar.style.width = rem + "%";
            if(elap >= sec * 1000) {
                clearInterval(timerInterval);
                if(isHost) forceNext();
            }
        }, 50); // 50ms 更新一次進度條，更順滑
    }

    window.submitAnswer = (idx) => {
        // 優化：直接從本地快取計算，不再 get()
        const limit = currentLocalData.settings.timeLimit * 1000;
        const elapsed = Date.now() - gameStartTime;
        const points = Math.max(100, Math.floor(1000 * ((limit - elapsed) / limit)));
        
        update(ref(db, `rooms/${myRoomId}/players/${myId}`), { 
            answer: idx, 
            tempAns: idx, 
            lastPoints: points 
        });
        
        document.getElementById('status-msg').innerText = "已鎖定！積分：" + points;
        if(isHost) setTimeout(checkRoundEnd, 200); // 延遲一下確保數據寫入
    };

    // ... 其餘 startGame, renderResult 等函數保持不變，但建議加入 list 渲染優化 ...
    
    function renderLobbyPlayers(playersObj) {
        const listHtml = Object.values(playersObj).map(p => 
            `<li style="padding:12px; background:white; margin:8px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.05); font-weight:bold; color:var(--primary-blue);">👤 ${p.name}</li>`
        ).join('');
        const listEl = document.getElementById('lobby-player-list');
        if(listEl.innerHTML !== listHtml) listEl.innerHTML = listHtml;
    }
</script>
