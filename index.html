<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識大亂鬥 (除錯版)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #333;
            margin: 0; padding: 20px;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .screen {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 90%; max-width: 500px;
            display: none; text-align: center;
        }
        .active { display: block; }
        input { width: 80%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 1.1rem; }
        button {
            background: linear-gradient(to right, #ff9966, #ff5e62);
            color: white; border: none; padding: 12px 25px;
            font-size: 1.1rem; border-radius: 50px; cursor: pointer; margin: 10px;
            font-weight: bold; width: 80%;
        }
        .btn-option { background: white; color: #333; border: 2px solid #eee; margin: 5px; width: 45%; height: 80px; border-radius: 10px; }
        .player-list { list-style: none; padding: 0; }
        .player-list li { background: #f0f8ff; margin: 5px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active">
        <h1>知識大亂鬥</h1>
        <p id="debug-status" style="color:red; font-weight:bold;">系統狀態：準備就緒</p>
        <input type="text" id="username" placeholder="你的暱稱" value="玩家1">
        <br>
        <button onclick="createRoom()">👑 建立房間</button>
        <br>
        <input type="tel" id="room-code-input" placeholder="輸入 4 位數房號" maxlength="4">
        <button onclick="joinRoom()" style="background: linear-gradient(to right, #4facfe, #00f2fe);">🚀 加入房間</button>
    </div>

    <div id="screen-lobby" class="screen">
        <h2>房間代碼</h2>
        <h1 id="display-room-code" style="font-size:3rem; color:#4facfe;">...</h1>
        <ul id="lobby-player-list" class="player-list"></ul>
        <button id="btn-start" onclick="startGame()" style="display:none;">🔥 開始遊戲</button>
        <p id="wait-msg">等待房主...</p>
    </div>

    <div id="screen-game" class="screen">
        <h2 id="q-counter">Q 1</h2>
        <h3 id="question-text">載入中...</h3>
        <div id="options-area">
            <button class="btn-option" onclick="submitAnswer(0)" id="opt-0">A</button>
            <button class="btn-option" onclick="submitAnswer(1)" id="opt-1">B</button>
            <button class="btn-option" onclick="submitAnswer(2)" id="opt-2">C</button>
            <button class="btn-option" onclick="submitAnswer(3)" id="opt-3">D</button>
        </div>
        <p id="status-msg"></p>
    </div>

    <div id="screen-result" class="screen">
        <h1>🏆 排名</h1>
        <ul id="result-list" class="player-list"></ul>
        <button onclick="location.reload()">回首頁</button>
    </div>

    <script type="module">
        // ★★★ 這是你圖片裡的設定，我直接填好了 ★★★
        const firebaseConfig = {
            apiKey: "AIzaSyCqOMWOyUKq-i9GlwB2KqpCpJCNAOvHlIY",
            authDomain: "voca-69.firebaseapp.com",
            databaseURL: "https://voca-69-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "voca-69",
            storageBucket: "voca-69.firebasestorage.app",
            messagingSenderId: "960668024510",
            appId: "1:960668024510:web:ef4148c6b0cad40dcf68ef",
            measurementId: "G-YRFJRVQJWV"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, get } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            console.log("Firebase initialized");
        } catch (e) {
            alert("Firebase 初始化失敗：" + e.message);
        }

        // 變數
        let myId = "user_" + Math.floor(Math.random() * 100000);
        let myRoomId = null;
        let isHost = false;

        // --- 錯誤攔截版 Create Room ---
        window.createRoom = async function() {
            const statusLabel = document.getElementById('debug-status');
            statusLabel.innerText = "正在連線資料庫...";
            
            try {
                const name = document.getElementById('username').value || '玩家';
                myRoomId = Math.floor(1000 + Math.random() * 9000).toString();
                isHost = true;

                // 測試連線
                statusLabel.innerText = "正在讀取題庫...";
                
                // 這裡最容易出錯，我們加上 try catch
                let questionBank = [];
                try {
                    const qSnap = await get(ref(db, 'global_questions'));
                    if(qSnap.exists()) questionBank = qSnap.val();
                    else questionBank = [{ q: "預設題目: 1+1=?", options: ["1","2","3","4"], ans: 1 }];
                } catch(dbError) {
                    throw new Error("資料庫讀取失敗！請檢查 Rules 是否已設為 true。\n詳細錯誤: " + dbError.message);
                }

                statusLabel.innerText = "正在建立房間...";
                await set(ref(db, 'rooms/' + myRoomId), {
                    state: 'lobby',
                    currentQIndex: -1,
                    showResult: false,
                    players: { [myId]: { name: name, score: 0, answer: -1 } },
                    questions: questionBank
                });

                enterLobby();

            } catch (e) {
                alert("❌ 錯誤發生：\n" + e.message);
                statusLabel.innerText = "發生錯誤，請截圖給工程師";
                console.error(e);
            }
        };

        window.joinRoom = async function() {
            try {
                const name = document.getElementById('username').value;
                myRoomId = document.getElementById('room-code-input').value;
                isHost = false;
                
                if(!myRoomId) throw new Error("請輸入房號");

                const snapshot = await get(ref(db, 'rooms/' + myRoomId));
                if (snapshot.exists() && snapshot.val().state === 'lobby') {
                    await update(ref(db, `rooms/${myRoomId}/players/${myId}`), {
                        name: name, score: 0, answer: -1
                    });
                    enterLobby();
                } else {
                    alert("房間不存在或遊戲已開始");
                }
            } catch(e) {
                alert("加入失敗：" + e.message);
            }
        };

        function enterLobby() {
            document.getElementById('display-room-code').innerText = myRoomId;
            showScreen('screen-lobby');
            if(isHost) {
                document.getElementById('btn-start').style.display = 'inline-block';
                document.getElementById('wait-msg').style.display = 'none';
            }
            onValue(ref(db, 'rooms/' + myRoomId), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                
                // 更新玩家列表
                const list = Object.values(data.players);
                document.getElementById('lobby-player-list').innerHTML = 
                    list.map(p => `<li>${p.name} (分數: ${p.score})</li>`).join('');

                if (data.state === 'playing') renderGame(data);
                else if (data.state === 'finished') renderResult(data.players);
            });
        }

        window.startGame = function() {
            update(ref(db, 'rooms/' + myRoomId), { state: 'playing', currentQIndex: 0, showResult: false });
        };

        window.submitAnswer = function(idx) {
            update(ref(db, `rooms/${myRoomId}/players/${myId}`), { answer: idx });
            document.getElementById('status-msg').innerText = "已回答，等待對手...";
            if(isHost) checkAllAnswered();
        };

        async function checkAllAnswered() {
            setTimeout(async () => {
                const s = await get(ref(db, 'rooms/' + myRoomId));
                const r = s.val();
                if(Object.values(r.players).every(p => p.answer !== -1) && !r.showResult) {
                    // 結算
                    const q = r.questions[r.currentQIndex];
                    const up = { showResult: true };
                    Object.entries(r.players).forEach(([pid, p]) => {
                        if(p.answer === q.ans) up[`players/${pid}/score`] = p.score + 100;
                        up[`players/${pid}/answer`] = -1;
                    });
                    await update(ref(db, 'rooms/' + myRoomId), up);
                    // 下一題倒數
                    setTimeout(() => {
                         if (r.currentQIndex + 1 >= r.questions.length) update(ref(db, 'rooms/' + myRoomId), { state: 'finished' });
                         else update(ref(db, 'rooms/' + myRoomId), { currentQIndex: r.currentQIndex + 1, showResult: false });
                    }, 3000);
                }
            }, 500);
        }

        function renderGame(r) {
            showScreen('screen-game');
            const q = r.questions[r.currentQIndex];
            document.getElementById('q-counter').innerText = `第 ${r.currentQIndex+1} 題`;
            document.getElementById('question-text').innerText = q.q;
            
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerText = q.options[i];
                btn.disabled = false;
                btn.style.background = "white";
                if(r.showResult) {
                    btn.disabled = true;
                    if(i === q.ans) btn.style.background = "#90ee90";
                }
            }
        }

        function renderResult(players) {
            showScreen('screen-result');
            document.getElementById('result-list').innerHTML = 
                Object.values(players).sort((a,b)=>b.score-a.score).map((p,i)=>`<li>#${i+1} ${p.name} : ${p.score}</li>`).join('');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
