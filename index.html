<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 知識王</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #2c3e50; color: white; text-align: center; margin: 0; padding: 20px; }
        .screen { display: none; max-width: 600px; margin: 0 auto; }
        .active { display: block; }
        input, button, textarea { font-size: 1.2rem; padding: 10px; margin: 5px; border-radius: 5px; border: none; width: 80%; }
        button { background: #e67e22; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #d35400; }
        .btn-option { background: #3498db; height: 80px; margin: 10px 0; width: 45%; display: inline-block; vertical-align: middle; }
        .btn-correct { background: #27ae60 !important; }
        .btn-wrong { background: #c0392b !important; }
        .option-container { display: flex; flex-wrap: wrap; justify-content: space-around; }
        .player-list { list-style: none; padding: 0; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px; }
        .player-list li { padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; }
        #admin-area { margin-top: 50px; border-top: 1px solid #7f8c8d; padding-top: 20px; }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active">
        <h1>Firebase 知識王</h1>
        <input type="text" id="username" placeholder="輸入暱稱" value="玩家1">
        <br>
        <button onclick="createRoom()">建立房間</button>
        <br>
        <div style="margin: 10px;">- OR -</div>
        <input type="text" id="room-code-input" placeholder="輸入房號" maxlength="4">
        <button onclick="joinRoom()">加入房間</button>

        <div id="admin-area">
            <h3>後台：設定題目 (全站通用)</h3>
            <textarea id="json-input" placeholder='[{"q":"題目","options":["A","B","C","D"],"ans":0}]' style="height:100px;"></textarea>
            <button onclick="updateGlobalQuestions()" style="background:#7f8c8d;">更新雲端題庫</button>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <h2>房號: <span id="display-room-code" style="color:#f1c40f;"></span></h2>
        <ul id="lobby-player-list" class="player-list"></ul>
        <button id="btn-start" onclick="startGame()" style="display:none;">開始遊戲</button>
        <p id="wait-msg">等待房主開始...</p>
    </div>

    <div id="screen-game" class="screen">
        <div style="display:flex; justify-content:space-between;">
            <span id="q-counter">Q 1</span>
            <span id="my-score">Score: 0</span>
        </div>
        <h2 id="question-text" style="min-height: 80px; display:flex; align-items:center; justify-content:center;">...</h2>
        <div class="option-container">
            <button class="btn-option" onclick="submitAnswer(0)" id="opt-0">A</button>
            <button class="btn-option" onclick="submitAnswer(1)" id="opt-1">B</button>
            <button class="btn-option" onclick="submitAnswer(2)" id="opt-2">C</button>
            <button class="btn-option" onclick="submitAnswer(3)" id="opt-3">D</button>
        </div>
        <div id="status-msg" style="margin-top:20px; color:#f1c40f;"></div>
    </div>

    <div id="screen-result" class="screen">
        <h1>最終排名</h1>
        <ul id="result-list" class="player-list"></ul>
        <button onclick="location.reload()">回首頁</button>
    </div>

    <script type="module">
        // -------------------------------------------------------------
        // apiKey: "AIzaSyCqOMW0yUKq-i9GlwB2KqpCpJCNAoVHlIY",
  authDomain: "voca-69.firebaseapp.com",
  databaseURL: "https://voca-69-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "voca-69",
  storageBucket: "voca-69.firebasestorage.app",
  messagingSenderId: "960668024510",
  appId: "1:960668024510:web:ef4148c6b0cad40dcf68ef",
  measurementId: "G-YRFJRVQJWV"
        // -------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, get, child } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 範例 Config (請換成你自己的，不然不能跑)
        const firebaseConfig = {
            apiKey: "你的_API_KEY",
            authDomain: "你的專案.firebaseapp.com",
            databaseURL: "https://你的專案-default-rtdb.firebaseio.com",
            projectId: "你的專案ID",
            storageBucket: "...",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- 變數 ---
        let myId = "user_" + Math.floor(Math.random() * 100000); // 隨機產生 ID
        let myRoomId = null;
        let myName = "";
        let isHost = false;
        let questionBank = []; // 從雲端抓

        // 預設題目 (防呆用)
        const defaultQuestions = [
            { q: "Firebase 是哪家公司的？", options: ["Apple", "Google", "Amazon", "Meta"], ans: 1 },
            { q: "HTML 是什麼？", options: ["程式語言", "標記語言", "資料庫", "作業系統"], ans: 1 }
        ];

        // --- 全域函式綁定 (因為 module 作用域問題) ---
        window.createRoom = createRoom;
        window.joinRoom = joinRoom;
        window.startGame = startGame;
        window.submitAnswer = submitAnswer;
        window.updateGlobalQuestions = updateGlobalQuestions;

        // --- 核心功能 ---

        async function createRoom() {
            myName = document.getElementById('username').value;
            myRoomId = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;

            // 1. 先抓題目庫
            await fetchQuestions();

            // 2. 寫入初始房間資料
            set(ref(db, 'rooms/' + myRoomId), {
                state: 'lobby',
                currentQIndex: -1,
                showResult: false, // 是否正在顯示上一題答案
                players: {
                    [myId]: { name: myName, score: 0, answer: -1 }
                },
                questions: questionBank
            });

            enterLobby();
        }

        async function joinRoom() {
            myName = document.getElementById('username').value;
            myRoomId = document.getElementById('room-code-input').value;
            isHost = false;

            const roomRef = ref(db, 'rooms/' + myRoomId);
            const snapshot = await get(roomRef);

            if (snapshot.exists() && snapshot.val().state === 'lobby') {
                // 加入玩家列表
                update(ref(db, `rooms/${myRoomId}/players/${myId}`), {
                    name: myName, score: 0, answer: -1
                });
                enterLobby();
            } else {
                alert("房間不存在或遊戲已開始");
            }
        }

        function enterLobby() {
            document.getElementById('display-room-code').innerText = myRoomId;
            showScreen('screen-lobby');
            if(isHost) {
                document.getElementById('btn-start').style.display = 'inline-block';
                document.getElementById('wait-msg').style.display = 'none';
            }

            // ★ 監聽房間變動 (核心)
            onValue(ref(db, 'rooms/' + myRoomId), (snapshot) => {
                const data = snapshot.val();
                if (!data) return; // 房間被刪除

                renderPlayers(data.players);

                // 狀態機跳轉
                if (data.state === 'playing') {
                    renderGame(data);
                } else if (data.state === 'finished') {
                    renderResult(data.players);
                }
            });
        }

        function startGame() {
            // 只有房主能按，更新資料庫狀態
            update(ref(db, 'rooms/' + myRoomId), {
                state: 'playing',
                currentQIndex: 0,
                showResult: false
            });
        }

        function submitAnswer(ansIdx) {
            // 寫入自己的答案
            update(ref(db, `rooms/${myRoomId}/players/${myId}`), {
                answer: ansIdx
            });
            document.getElementById(`opt-${ansIdx}`).style.border = "3px solid white";
            document.getElementById('status-msg').innerText = "等待其他人...";
            
            // 房主負責檢查是否大家都答題了 (簡單實作)
            if(isHost) checkAllAnswered();
        }

        // --- 房主專用邏輯 (Host 兼當 Server) ---
        async function checkAllAnswered() {
            // 稍微延遲避免讀取未完成
            setTimeout(async () => {
                const snapshot = await get(ref(db, 'rooms/' + myRoomId));
                const room = snapshot.val();
                const players = Object.values(room.players);
                const totalPlayers = players.length;
                const answeredPlayers = players.filter(p => p.answer !== -1).length;

                if (answeredPlayers === totalPlayers && !room.showResult) {
                    // 大家都答了 -> 結算分數
                    calculateScore(room);
                }
            }, 500);
        }

        function calculateScore(room) {
            const currentQ = room.questions[room.currentQIndex];
            const updates = {};
            
            // 更新每個人的分數
            for (const [pid, player] of Object.entries(room.players)) {
                if (player.answer === currentQ.ans) {
                    updates[`players/${pid}/score`] = player.score + 100;
                }
                updates[`players/${pid}/answer`] = -1; // 重置答案
            }
            
            updates['showResult'] = true; // 標記顯示結果狀態
            update(ref(db, 'rooms/' + myRoomId), updates);

            // 3秒後下一題
            setTimeout(() => {
                if (room.currentQIndex + 1 >= room.questions.length) {
                    update(ref(db, 'rooms/' + myRoomId), { state: 'finished' });
                } else {
                    update(ref(db, 'rooms/' + myRoomId), {
                        currentQIndex: room.currentQIndex + 1,
                        showResult: false
                    });
                }
            }, 3000);
        }

        // --- 畫面渲染 ---
        
        function renderGame(room) {
            showScreen('screen-game');
            const q = room.questions[room.currentQIndex];
            
            document.getElementById('q-counter').innerText = `Q ${room.currentQIndex + 1}`;
            document.getElementById('question-text').innerText = q.q;

            // 顯示我的分數
            const myData = room.players[myId];
            if(myData) document.getElementById('my-score').innerText = "Score: " + myData.score;

            // 選項按鈕狀態
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerText = q.options[i];
                btn.className = 'btn-option';
                btn.style.border = 'none';
                btn.disabled = false;

                // 如果是結算階段，顯示對錯
                if (room.showResult) {
                    btn.disabled = true;
                    if (i === q.ans) btn.classList.add('btn-correct');
                    else if (myData.answer === i) btn.classList.add('btn-wrong'); // 如果我選錯
                }
            }

            if(room.showResult) {
                document.getElementById('status-msg').innerText = "本題結束！準備下一題...";
            } else if (myData && myData.answer !== -1) {
                 // 已經回答過
                 document.getElementById('status-msg').innerText = "已回答，等待對手...";
                 // 鎖定按鈕
                 for(let i=0; i<4; i++) document.getElementById(`opt-${i}`).disabled = true;
            } else {
                document.getElementById('status-msg').innerText = "";
            }
        }

        function renderPlayers(playersObj) {
            if(!playersObj) return;
            const list = Object.values(playersObj);
            document.getElementById('lobby-player-list').innerHTML = 
                list.map(p => `<li><span>${p.name}</span> <span>${p.score}</span></li>`).join('');
        }

        function renderResult(playersObj) {
            showScreen('screen-result');
            const list = Object.values(playersObj).sort((a,b) => b.score - a.score);
            document.getElementById('result-list').innerHTML = 
                list.map((p, i) => `<li><span>#${i+1} ${p.name}</span> <span>${p.score}</span></li>`).join('');
        }

        // --- 輔助 & 後台 ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 上傳全域題庫
        function updateGlobalQuestions() {
            const json = document.getElementById('json-input').value;
            try {
                const data = JSON.parse(json);
                set(ref(db, 'global_questions'), data); // 存到雲端
                alert('題庫更新成功！');
            } catch(e) { alert('JSON 格式錯誤'); }
        }

        // 抓取題庫 (如果有雲端題庫就用，沒有就用預設)
        async function fetchQuestions() {
            const snapshot = await get(ref(db, 'global_questions'));
            if (snapshot.exists()) {
                questionBank = snapshot.val();
            } else {
                questionBank = defaultQuestions;
            }
        }

    </script>
</body>
</html>
