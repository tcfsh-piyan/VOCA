<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字彙王 - 題庫控制台</title>
    <style>
        :root { --primary-blue: #1A237E; --light-blue: #E8EAF6; --accent-orange: #FF7043; --success: #4CAF50; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f4f6f8; margin: 0; padding: 40px; color: #333; }
        
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { color: var(--primary-blue); margin-top: 0; border-bottom: 2px solid var(--light-blue); padding-bottom: 20px; }
        
        .control-panel { background: var(--light-blue); padding: 25px; border-radius: 15px; margin-bottom: 30px; }
        label { font-weight: bold; color: var(--primary-blue); display: block; margin-bottom: 8px; margin-top: 15px; }
        
        select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; box-sizing: border-box; font-family: monospace; }
        textarea { height: 250px; resize: vertical; }
        
        button { background: var(--primary-blue); color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 20px; width: 100%; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .status-box { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; }
        .success { background: #E8F5E9; color: #2E7D32; border: 1px solid #C8E6C9; }
        .error { background: #FFEBEE; color: #C62828; border: 1px solid #FFCDD2; }

        .preview-area { margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px; }
        .preview-item { background: #fafafa; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .tag { display: inline-block; padding: 2px 8px; background: #eee; border-radius: 4px; font-size: 0.8rem; color: #666; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ 字彙王 題庫控制台</h1>

    <div class="control-panel">
        <label>1. 選擇要操作的難度等級</label>
        <select id="import-level" onchange="loadPreview()">
            <option value="lv4">Level 4 (進階單字)</option>
            <option value="lv5" selected>Level 5 (高階單字)</option>
            <option value="lv6">Level 6 (挑戰單字)</option>
        </select>

        <label>2. 貼上題庫 JSON 資料</label>
        <textarea id="json-input" placeholder='格式範例：
[
  { "q": "Vocabulary", "options": ["單字", "文法", "聽力", "閱讀"], "ans": 0 },
  ...
]'></textarea>

        <button onclick="bulkImport()">🚀 覆蓋匯入資料庫</button>
        
        <div id="status-msg" class="status-box"></div>
    </div>

    <div class="preview-area">
        <h3>📊 目前資料庫狀態：<span id="current-level-display">Level 5</span></h3>
        <p id="count-display">正在讀取...</p>
        <div id="preview-list"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 使用你的 voca-69 設定
    const firebaseConfig = {
        apiKey: "AIzaSyCqOMWOyUKq-i9GlwB2KqpCpJCNAOvHlIY",
        authDomain: "voca-69.firebaseapp.com",
        databaseURL: "https://voca-69-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "voca-69",
        storageBucket: "voca-69.firebasestorage.app",
        messagingSenderId: "960668024510",
        appId: "1:960668024510:web:ef4148c6b0cad40dcf68ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 頁面載入時先讀取一次預覽
    window.onload = loadPreview;

    // 將函數掛載到 window 以便 HTML 按鈕呼叫
    window.loadPreview = loadPreview;
    window.bulkImport = bulkImport;

    async function loadPreview() {
        const lv = document.getElementById('import-level').value;
        document.getElementById('current-level-display').innerText = lv.toUpperCase();
        document.getElementById('preview-list').innerHTML = '<p style="color:#999;">讀取中...</p>';
        
        try {
            const snap = await get(ref(db, 'global_questions/' + lv));
            if (snap.exists()) {
                const data = snap.val();
                document.getElementById('count-display').innerHTML = `此等級目前共有 <b>${data.length}</b> 題`;
                
                // 只顯示前 5 題作為預覽
                const previewHtml = data.slice(0, 5).map((item, i) => `
                    <div class="preview-item">
                        <span class="tag">#${i+1}</span> <b>${item.q}</b> 
                        <span style="color:green; margin-left:10px;">(正解: ${item.options[item.ans]})</span>
                    </div>
                `).join('');
                document.getElementById('preview-list').innerHTML = previewHtml + (data.length > 5 ? `<div style="padding:10px; color:#666;">...還有 ${data.length - 5} 題</div>` : '');
            } else {
                document.getElementById('count-display').innerText = "此等級目前是空的 (0 題)";
                document.getElementById('preview-list').innerHTML = "";
            }
        } catch (e) {
            document.getElementById('count-display').innerText = "讀取失敗";
            console.error(e);
        }
    }

    async function bulkImport() {
        const lv = document.getElementById('import-level').value;
        const raw = document.getElementById('json-input').value;
        const statusBox = document.getElementById('status-msg');

        if (!raw.trim()) {
            showStatus("請輸入 JSON 資料", "error");
            return;
        }

        try {
            const data = JSON.parse(raw);
            if (!Array.isArray(data)) throw new Error("資料格式錯誤：必須是陣列 [ ... ]");
            
            // 寫入資料庫
            await set(ref(db, 'global_questions/' + lv), data);
            
            showStatus(`✅ 成功！已將 ${data.length} 題匯入 ${lv}。`, "success");
            document.getElementById('json-input').value = ""; // 清空輸入框
            loadPreview(); // 重新整理預覽
            
        } catch (e) {
            showStatus("❌ 匯入失敗：" + e.message, "error");
        }
    }

    function showStatus(msg, type) {
        const box = document.getElementById('status-msg');
        box.style.display = 'block';
        box.className = 'status-box ' + type;
        box.innerText = msg;
    }
</script>

</body>
</html>
