<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>字彙王 - 題庫管理中心</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 40px; color: #1A237E; }
        .card { background: white; max-width: 800px; margin: 0 auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { border-bottom: 2px solid #E8EAF6; padding-bottom: 10px; }
        textarea { width: 100%; height: 200px; padding: 15px; border-radius: 10px; border: 1px solid #ddd; font-family: monospace; box-sizing: border-box; }
        button { background: #1A237E; color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .import-box { background: #E8EAF6; padding: 20px; border-radius: 15px; margin-bottom: 30px; }
        .q-item { background: #fafafa; border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>字彙王 題庫控制台</h1>

    <div class="import-box">
        <h3>🚀 大量匯入題目</h3>
        <p style="font-size:0.8rem; color:#666;">請貼上 JSON 陣列格式。範例：[{"q":"apple","options":["蘋果","香蕉","橘子","水梨"],"ans":0}]</p>
        <textarea id="bulk-json" placeholder='貼上你的題目資料...'></textarea>
        <button onclick="bulkImport()">確認大量匯入 (覆蓋現有題庫)</button>
    </div>

    <div id="status-area"></div>
    <div id="q-list"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCqOMWOyUKq-i9GlwB2KqpCpJCNAOvHlIY",
        authDomain: "voca-69.firebaseapp.com",
        databaseURL: "https://voca-69-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "voca-69",
        storageBucket: "voca-69.firebasestorage.app",
        messagingSenderId: "960668024510",
        appId: "1:960668024510:web:ef4148c6b0cad40dcf68ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.bulkImport = async () => {
        const raw = document.getElementById('bulk-json').value;
        try {
            const data = JSON.parse(raw);
            if(!Array.isArray(data)) throw new Error("必須是陣列格式 []");
            
            await set(ref(db, 'global_questions'), data);
            alert("✅ 題庫更新成功！共匯入 " + data.length + " 題。");
            location.reload();
        } catch(e) {
            alert("❌ 匯入失敗，請檢查 JSON 格式是否正確。\n錯誤：" + e.message);
        }
    }

    // 載入列表顯示
    const snap = await get(ref(db, 'global_questions'));
    if(snap.exists()){
        const qs = snap.val();
        document.getElementById('q-list').innerHTML = `<h3>目前題庫 (${qs.length} 題)</h3>` + qs.map((q,i)=>`
            <div class="q-item">
                <b>${i+1}. ${q.q}</b><br>
                <small>正解：${q.options[q.ans]}</small>
            </div>
        `).join('');
    }
</script>

</body>
</html>
