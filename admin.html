<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>字彙王 - 極速後台管理</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 40px; color: #1A237E; }
        .card { background: white; max-width: 700px; margin: 0 auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 300px; padding: 15px; border-radius: 10px; border: 1px solid #ddd; font-family: monospace; box-sizing: border-box; }
        select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; }
        button { background: #1A237E; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1rem; }
        .info { background: #E8EAF6; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 字彙王 極速匯入後台</h1>
    
    <div class="info">
        <label><b>1. 選擇要存入的難度等級：</b></label>
        <select id="import-level">
            <option value="lv4">Level 4 (進階單字)</option>
            <option value="lv5">Level 5 (高階單字)</option>
            <option value="lv6">Level 6 (挑戰單字)</option>
        </select>
        
        <label><b>2. 貼上 JSON 題目資料：</b></label>
        <p style="font-size:0.8rem; color:#666;">* 此動作將覆蓋該難度原本的所有題目</p>
        <textarea id="bulk-json" placeholder='[...] 格式範例'></textarea>
        
        <button onclick="bulkImport()">⚡ 執行大量匯入</button>
    </div>

    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCqOMWOyUKq-i9GlwB2KqpCpJCNAOvHlIY",
        authDomain: "voca-69.firebaseapp.com",
        databaseURL: "https://voca-69-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "voca-69",
        storageBucket: "voca-69.firebasestorage.app",
        messagingSenderId: "960668024510",
        appId: "1:960668024510:web:ef4148c6b0cad40dcf68ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.bulkImport = async () => {
        const lv = document.getElementById('import-level').value;
        const raw = document.getElementById('bulk-json').value;
        const statusDiv = document.getElementById('status');
        
        statusDiv.innerHTML = "<p>正在上傳至雲端...</p>";

        try {
            const data = JSON.parse(raw);
            if(!Array.isArray(data)) throw new Error("資料必須是 [ ] 陣列格式");
            
            // 存入指定的難度節點
            await set(ref(db, 'global_questions/' + lv), data);
            
            statusDiv.innerHTML = `<div style="color:green; font-weight:bold; border:2px solid green; padding:15px; border-radius:10px;">
                ✅ 成功！已將 ${data.length} 題存入 ${lv} 題庫。
            </div>`;
            document.getElementById('bulk-json').value = "";
        } catch(e) {
            statusDiv.innerHTML = `<p style="color:red;">❌ 失敗：${e.message}</p>`;
        }
    }
</script>

</body>
</html>
